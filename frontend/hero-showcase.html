<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TD Motors | Hero</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap">

<!-- ===================================================================
     PART 1 of 2: STYLES
     In your real index.html, put this inside the existing <style> tag
     (replace the old ".hero ..." and ".car-a ... .car-d" rules).
     =================================================================== -->
<style>
:root{
  color-scheme:dark;
  --tarmac:#0a0b0d;
  --text:#f3f1ec;
  --muted:#cfd2d6;
  --amber:#ffb020;
  --display:"Bebas Neue","Oswald",Impact,"Arial Narrow",sans-serif;
  --body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html{background:var(--tarmac)}
body{margin:0;background:var(--tarmac);color:var(--text);font-family:var(--body);line-height:1.55;-webkit-font-smoothing:antialiased}
.wrap{width:100%;max-width:1280px;margin-inline:auto;padding-inline:16px}
:focus-visible{outline:2px solid var(--amber);outline-offset:3px;border-radius:4px}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:52px;padding:0 28px;border-radius:2px;
  font:700 13px/1 var(--body);letter-spacing:.16em;text-transform:uppercase;text-decoration:none;cursor:pointer;
  border:1px solid transparent;transition:transform .2s,box-shadow .2s,border-color .2s,color .2s}
.btn-primary{background:var(--amber);color:#140d00}
.btn-primary:hover{box-shadow:0 0 34px rgba(255,176,32,.45);transform:translateY(-2px)}
.btn-ghost{border-color:rgba(255,255,255,.28);color:var(--text);background:rgba(255,255,255,.03)}
.btn-ghost:hover{border-color:var(--amber);color:var(--amber)}

/* ---------- hero ---------- */
.hero{
  /* TUNE THE FORMATION HERE: only change these six values */
  --front-w: min(36%, 58vh);              /* width of BMW + Fortuner (foreground)         */
  --back-w: calc(var(--front-w) * .75);   /* width of Range Rover + Scorpio (background)  */
  --gap: 1.5%;                            /* half of the empty space in the centre        */
  --edge: 1%;                             /* back cars' distance from the screen edges    */
  --front-bottom: 6%;                     /* front row height above the bottom            */
  --back-bottom: 18%;                     /* back row height above the bottom             */

  position:relative;
  min-height:max(100svh,680px);
  overflow:hidden;
  background:
    radial-gradient(70% 50% at 50% 100%, rgba(158,132,98,.28), transparent 70%),
    radial-gradient(120% 70% at 50% 0%, #1b1e24 0%, var(--tarmac) 62%);
}

/* copy: headline + buttons sit above the cars */
.hero-copy{position:relative;z-index:5;padding-top:112px;text-align:center}
.hero h1{margin:0;font:400 clamp(48px,9.6vw,148px)/.9 var(--display);letter-spacing:.01em;text-transform:uppercase;text-wrap:balance}
.hero h1 span{display:block}
.hero h1 .amb{color:var(--amber);text-shadow:0 0 40px rgba(255,176,32,.35)}
.hero-sub{margin:20px auto 0;max-width:46ch;font-size:clamp(13px,1.6vw,16px);letter-spacing:.16em;text-transform:uppercase;font-weight:500;
  color:var(--muted);text-shadow:0 2px 14px rgba(0,0,0,.9),0 0 3px rgba(0,0,0,.8)}
.hero-cta{position:relative;z-index:10;display:flex;flex-wrap:wrap;gap:14px;justify-content:center;margin-top:30px}

/* cars: one container, four absolutely positioned wrappers */
.scene{position:absolute;inset:0;z-index:2;pointer-events:none}
.car{position:absolute;will-change:transform}
.car img{display:block;width:100%;height:auto;filter:brightness(.92) drop-shadow(0 18px 28px rgba(0,0,0,.55))}
.flipx{display:block;transform:scaleX(-1)}   /* faces the Scorpio toward the centre */

/* OUTER cars: smaller, behind, pushed toward the edges */
.car-a,.car-b{width:var(--back-w);bottom:var(--back-bottom);z-index:1}
.car-a{left:var(--edge)}                /* Range Rover */
.car-b{right:var(--edge)}               /* Scorpio     */

/* INNER cars: larger, in front, mirrored around the centre line */
.car-c,.car-d{width:var(--front-w);bottom:var(--front-bottom);z-index:3}
.car-c{right:calc(50% + var(--gap))}    /* BMW      */
.car-d{left:calc(50% + var(--gap))}     /* Fortuner */

/* soft contact shadow under every car */
.car::after{content:"";position:absolute;left:6%;right:6%;bottom:-2%;height:9%;z-index:-1;
  background:radial-gradient(50% 50% at 50% 50%, rgba(0,0,0,.8), transparent 70%);filter:blur(7px)}

/* one entrance: back row first, then front row rises in (uses "translate" so it never fights GSAP's transform) */
@keyframes rise{from{opacity:0;translate:0 90px}to{opacity:1;translate:0 0}}
.car{animation:rise 1s cubic-bezier(.2,.7,.2,1) both}
.car-a,.car-b{animation-delay:.1s}
.car-c,.car-d{animation-delay:.35s}

/* phones: cars fill the width, back row tucks partly off-screen */
@media (max-width:700px){
  .hero{--front-w:56%;--gap:0%;--edge:-10%;--back-bottom:20%}
}
@media (prefers-reduced-motion:reduce){
  .car{animation:none}
  .btn{transition:none}
}
</style>
</head>
<body>

<!-- ===================================================================
     PART 2 of 2: HTML
     In your real index.html, this replaces the existing
     <section class="hero" id="top"> ... </section>
     =================================================================== -->
<section class="hero" id="top">

  <div class="hero-copy wrap">
    <h1><span>Dominate</span><span>Every <b class="amb" style="font-weight:400">Terrain.</b></span></h1>
    <p class="hero-sub">Multi-brand new cars, detailing, spare parts, insurance and finance in Kharadi, Pune</p>
    <div class="hero-cta">
      <a class="btn btn-primary" href="#fleet">Explore Cars</a>
      <button class="btn btn-ghost" type="button" data-enq data-service="Test Drive">Book a Test Drive</button>
    </div>
  </div>

  <div class="scene" aria-hidden="true">
    <!-- back row -->
    <div class="car car-a"><img src="images/hero/rover.webp"    alt=""></div>
    <div class="car car-b"><span class="flipx"><img src="images/hero/scorpio.webp" alt=""></span></div>
    <!-- front row -->
    <div class="car car-c"><img src="images/hero/bmw.webp"      alt=""></div>
    <div class="car car-d"><img src="images/hero/fortuner.webp" alt=""></div>
  </div>

</section>

</body>
</html>
